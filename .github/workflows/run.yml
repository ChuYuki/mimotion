name: 刷步数

on:
  # 每小时一个候选触发，覆盖 GitHub 已观测到的 0–8 小时调度延迟。
  schedule:
    # 北京时间上午窗口及此前 8 小时
    - cron: '10 0,16-23 * * *'
    # 北京时间下午窗口及此前 8 小时
    - cron: '40 1-9 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 提交时段
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: write

concurrency:
  group: mimotion-submit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 最早 03:00 触发、最晚 08:30 提交，需容纳 5.5 小时等待（GitHub 单 job 硬上限 6 小时）
    timeout-minutes: 345
    steps:
      - name: 判断北京时间窗口
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PERIOD: ${{ inputs.period }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          period = os.environ.get("MANUAL_PERIOD", "morning")
          active = os.environ["EVENT_NAME"] == "workflow_dispatch"
          # 窗口从目标时段起点往前放宽 4~5 小时：GitHub 对公开仓库的 schedule 限流
          # 会砍掉大部分候选触发并随机漂移，窄窗口实测 5 天只命中 2 次早上、0 次傍晚。
          # 命中后由下方 submit 步骤 sleep 到真正的提交时间点，提交时刻不变。
          morning = range(3 * 60, 8 * 60 + 31)
          evening = range(12 * 60, 17 * 60 + 51)

          if not active:
              minute = now.hour * 60 + now.minute
              if minute in morning:
                  period, active = "morning", True
              elif minute in evening:
                  period, active = "evening", True

          assert 2 * 60 + 59 not in morning and 8 * 60 + 30 in morning and 17 * 60 + 50 in evening
          assert not set(morning) & set(evening)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"active={str(active).lower()}", file=output)
              print(f"period={period}", file=output)
              print(f"day={now:%Y-%m-%d}", file=output)
              print(f"month_day={now:%d}", file=output)
              print(f"scheduled={str(os.environ['EVENT_NAME'] == 'schedule').lower()}", file=output)
          print(f"北京时间 {now:%F %T}，{'进入' if active else '不在'}提交窗口")
          PY

      - name: 检查今日提交锁
        id: lock
        if: steps.window.outputs.active == 'true' && steps.window.outputs.scheduled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .mimotion-lock
          key: mimotion-${{ steps.window.outputs.day }}-${{ steps.window.outputs.period }}
          lookup-only: true

      - name: Checkout codes
        if: steps.window.outputs.active == 'true' && steps.lock.outputs.cache-hit != 'true'
        uses: actions/checkout@v5

      - name: 初始化Python
        if: steps.window.outputs.active == 'true' && steps.lock.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖
        if: steps.window.outputs.active == 'true' && steps.lock.outputs.cache-hit != 'true'
        run: pip3 install -r requirements.txt

      - name: 随机时间和步数并提交
        id: submit
        if: steps.window.outputs.active == 'true' && steps.lock.outputs.cache-hit != 'true'
        env:
          ZEPP_USER: ${{ secrets.ZEPP_USER }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          PERIOD: ${{ steps.window.outputs.period }}
          SCHEDULED: ${{ steps.window.outputs.scheduled }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import random
          import subprocess
          import sys
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          periods = {
              "morning": ((8, 10), (8, 30), (1026, 1226)),
              "evening": ((17, 40), (17, 50), (3250, 3450)),
          }
          period = os.environ["PERIOD"]
          start_time, end_time, step_range = periods[period]
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          delay = 0

          if os.environ["SCHEDULED"] == "true":
              start = now.replace(hour=start_time[0], minute=start_time[1], second=0, microsecond=0)
              end = now.replace(hour=end_time[0], minute=end_time[1], second=59, microsecond=0)
              earliest = max(now, start)
              remaining = int((end - earliest).total_seconds())
              if remaining < 0:
                  print("依赖安装完成时已超过窗口，本次不提交")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      print("submitted=false", file=output)
                  raise SystemExit
              delay = int((earliest - now).total_seconds()) + random.randint(0, remaining)

          step = random.randint(*step_range)
          target = datetime.fromtimestamp(now.timestamp() + delay, ZoneInfo("Asia/Shanghai"))
          print(f"计划北京时间 {target:%H:%M:%S} 提交 {step} 步")
          time.sleep(delay)

          config = {
              "USER": os.environ["ZEPP_USER"],
              "PWD": os.environ["ZEPP_PASSWORD"],
              "MIN_STEP": str(step),
              "MAX_STEP": str(step),
              "SCALE_STEP_BY_TIME": "False",
              "USE_CONCURRENT": "False",
          }
          env = os.environ.copy()
          env["CONFIG"] = json.dumps(config, separators=(",", ":"))
          subprocess.run([sys.executable, "main.py"], check=True, env=env)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("submitted=true", file=output)
          PY

      - name: 写入今日提交锁
        if: steps.submit.outputs.submitted == 'true' && steps.window.outputs.scheduled == 'true'
        run: mkdir -p .mimotion-lock && date -u > .mimotion-lock/submitted-at

      - name: 保存今日提交锁
        if: steps.submit.outputs.submitted == 'true' && steps.window.outputs.scheduled == 'true'
        uses: actions/cache/save@v4
        with:
          path: .mimotion-lock
          key: mimotion-${{ steps.window.outputs.day }}-${{ steps.window.outputs.period }}

      - name: 保持公开仓库定时任务启用
        if: steps.submit.outputs.submitted == 'true' && steps.window.outputs.scheduled == 'true' && steps.window.outputs.month_day == '01'
        run: |
          date -u +%Y-%m > .github/keepalive
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/keepalive
          git diff --cached --quiet || git commit -m "chore: keep scheduled workflow active"
          git push
