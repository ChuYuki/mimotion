name: 刷步数

on:
  schedule:
    # UTC 00:10 = Asia/Shanghai 08:10
    - cron: '10 0 * * *'
    # UTC 09:40 = Asia/Shanghai 17:40
    - cron: '40 9 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 提交时段
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 生成北京时间随机任务
        env:
          BASE_CONFIG: ${{ secrets.CONFIG }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PERIOD: ${{ inputs.period }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import random
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          periods = {
              "morning": ((8, 10), (8, 30), (1026, 1226)),
              "evening": ((17, 40), (17, 50), (3250, 3450)),
          }
          schedule_periods = {
              "10 0 * * *": "morning",
              "40 9 * * *": "evening",
          }
          period = schedule_periods.get(os.environ.get("SCHEDULE")) or os.environ.get("MANUAL_PERIOD", "morning")
          start_time, end_time, step_range = periods[period]
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          start = now.replace(hour=start_time[0], minute=start_time[1], second=0, microsecond=0)
          end = now.replace(hour=end_time[0], minute=end_time[1], second=59, microsecond=0)

          if now > end:
              print(f"北京时间 {now:%H:%M:%S} 已错过 {period} 窗口，跳过本次提交")
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write("RUN_SYNC=false\n")
              raise SystemExit

          earliest = max(now, start)
          delay = random.randint(0, int((end - earliest).total_seconds()))
          target = earliest.timestamp() + delay
          step = random.randint(*step_range)
          print(f"计划北京时间 {datetime.fromtimestamp(target, ZoneInfo('Asia/Shanghai')):%H:%M:%S} 提交 {step} 步")
          time.sleep(delay)

          config = json.loads(os.environ["BASE_CONFIG"])
          config.update({
              "MIN_STEP": str(step),
              "MAX_STEP": str(step),
              "SCALE_STEP_BY_TIME": "False",
              "USE_CONCURRENT": "False",
          })
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("RUN_SYNC=true\n")
              output.write("CONFIG=" + json.dumps(config, separators=(",", ":")) + "\n")
          PY

      - name: 开始
        if: env.RUN_SYNC == 'true'
        run: |
          pip3 install -r requirements.txt
          python3 main.py
