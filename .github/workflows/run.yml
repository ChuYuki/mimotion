name: 刷步数

on:
  schedule:
    # 提前 5 分钟启动 Runner，实际提交仍限制在北京时间 08:10–08:30
    - cron: '5 0 * * *'
    # 提前 5 分钟启动 Runner，实际提交仍限制在北京时间 17:40–17:50
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: 提交时段
        type: choice
        options:
          - morning
          - evening
        default: morning

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: pip3 install -r requirements.txt

      - name: 生成北京时间随机任务
        env:
          ZEPP_USER: ${{ secrets.ZEPP_USER }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PERIOD: ${{ inputs.period }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import random
          import subprocess
          import sys
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          periods = {
              "morning": ((8, 10), (8, 30), (1026, 1226)),
              "evening": ((17, 40), (17, 50), (3250, 3450)),
          }
          schedule_periods = {
              "5 0 * * *": "morning",
              "35 9 * * *": "evening",
          }
          schedule = os.environ.get("SCHEDULE")
          period = schedule_periods.get(schedule) or os.environ.get("MANUAL_PERIOD", "morning")
          start_time, end_time, step_range = periods[period]
          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          start = now.replace(hour=start_time[0], minute=start_time[1], second=0, microsecond=0)
          end = now.replace(hour=end_time[0], minute=end_time[1], second=59, microsecond=0)

          if schedule and now > end:
              print(f"北京时间 {now:%H:%M:%S} 不在 {period} 窗口，跳过本次提交")
              raise SystemExit

          earliest = max(now, start) if schedule else now
          delay = random.randint(0, int((end - earliest).total_seconds())) if schedule else 0
          target = earliest.timestamp() + delay
          step = random.randint(*step_range)
          print(f"计划北京时间 {datetime.fromtimestamp(target, ZoneInfo('Asia/Shanghai')):%H:%M:%S} 提交 {step} 步")
          time.sleep(delay)

          config = {
              "USER": os.environ["ZEPP_USER"],
              "PWD": os.environ["ZEPP_PASSWORD"],
              "MIN_STEP": str(step),
              "MAX_STEP": str(step),
              "SCALE_STEP_BY_TIME": "False",
              "USE_CONCURRENT": "False",
          }
          env = os.environ.copy()
          env["CONFIG"] = json.dumps(config, separators=(",", ":"))
          subprocess.run([sys.executable, "main.py"], check=True, env=env)
          PY
